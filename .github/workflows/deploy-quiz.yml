# Deploys the HomPub Quiz referee (everything under quiz/) to PRODUCTION.
#
# It never runs on its own. A merge to main deploys nothing. To deploy:
#   repository → Actions → "Deploy quiz (production)" → Run workflow, on branch main.
# The job then waits for a required reviewer to press Approve, because it uses the
# GitHub Environment "production" (deployment branch main only, required reviewer,
# administrators may not bypass). The production Cloudflare token lives only in that
# environment, so no other workflow or branch can reach it.
#
# Actions
#   deploy          deploy the code on main, then tag that commit with release_tag
#                   (for example quiz-phase-1) so it can be redeployed later.
#   redeploy-ref    roll back by deploying an earlier tag or commit (ref). Keeps the
#                   Worker's CURRENT secrets. This is the normal way to roll back.
#   rollback-version
#                   Cloudflare's own rollback to a version id. Each version keeps the
#                   secrets it was created with, so this can bring back an old
#                   HOST_PASSCODE or SESSION_KEY. It only runs when
#                   accept_secret_revert is ticked.
#   d1-restore      put the quiz library (D1) back to a Time Travel bookmark. It
#                   overwrites every quiz saved since; do "Export all" on the host page
#                   first. Prints the bookmark to undo it, and changes the library
#                   generation so every host page drops its cached copy and reloads.
#                   Only runs when confirm_d1_restore is ticked.
#
# deploy and redeploy-ref apply new D1 migrations (quiz/migrations) before deploying,
# after printing the database's current bookmark so a migration can be undone with
# d1-restore. A ref from before the library existed has no migrations to apply.
#
# Every deploy restarts every Durable Object and drops every open WebSocket. Phones
# reconnect within seconds, but run it outside class time.

name: Deploy quiz (production)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        type: choice
        options: [deploy, redeploy-ref, rollback-version, d1-restore]
        default: deploy
      release_tag:
        description: 'deploy: tag to create on the deployed commit (quiz-phase-N)'
        type: string
        default: ''
      ref:
        description: 'redeploy-ref: an earlier tag (quiz-phase-N) or a full 40-character commit id'
        type: string
        default: ''
      version_id:
        description: 'rollback-version: the Cloudflare version id (UUID)'
        type: string
        default: ''
      accept_secret_revert:
        description: 'rollback-version: I understand secrets from that version may come back'
        type: boolean
        default: false
      bookmark:
        description: 'd1-restore: the D1 Time Travel bookmark to restore to'
        type: string
        default: ''
      confirm_d1_restore:
        description: 'd1-restore: I exported all quizzes; quizzes saved after the bookmark will be lost'
        type: boolean
        default: false
      reason:
        description: 'Short reason, shown in the Cloudflare deployment history'
        type: string
        default: 'Deployed from GitHub Actions'

permissions:
  contents: read

concurrency:
  group: deploy-quiz-production
  cancel-in-progress: false

jobs:
  production:
    name: Production (${{ inputs.action }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write   # only to push the release tag after a successful deploy
    env:
      ACTION: ${{ inputs.action }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      REF_INPUT: ${{ inputs.ref }}
      VERSION_ID: ${{ inputs.version_id }}
      ACCEPT_SECRET_REVERT: ${{ inputs.accept_secret_revert }}
      BOOKMARK: ${{ inputs.bookmark }}
      CONFIRM_D1_RESTORE: ${{ inputs.confirm_d1_restore }}
      REASON: ${{ inputs.reason }}
    # bash -eo pipefail: a failing `wrangler … | tee` fails the step instead of passing.
    defaults:
      run:
        shell: bash
    steps:
      # Each input is matched as a whole string ([[ =~ ]], not grep, which passes when
      # any one line matches), and nothing typed in goes into $GITHUB_ENV.
      - name: Check the inputs
        id: pick
        run: |
          set -u
          tag_re='^quiz-phase-[0-9]+([.][0-9]+)?$'
          ref_re='^(quiz-phase-[0-9]+([.][0-9]+)?|[0-9a-f]{40})$'
          uuid_re='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          reason_re='^[A-Za-z0-9][A-Za-z0-9 .,:()_/-]{0,99}$'
          # A bookmark looks like 00000085-0000024c-00004c6d-8e61117bf38d7adb71b934ebbf891683.
          bookmark_re='^[0-9a-f]{8}(-[0-9a-f]{8,64}){1,6}$'
          case "$ACTION" in
            deploy)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Run this from main."; exit 1; fi
              [[ $RELEASE_TAG =~ $tag_re ]] || { echo "::error::release_tag must look like quiz-phase-1"; exit 1; }
              echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT" ;;
            redeploy-ref)
              [[ $REF_INPUT =~ $ref_re ]] || { echo "::error::ref must be a quiz-phase-N tag or a 40-character commit id"; exit 1; }
              echo "ref=$REF_INPUT" >> "$GITHUB_OUTPUT" ;;
            rollback-version)
              [[ $VERSION_ID =~ $uuid_re ]] || { echo "::error::version_id must be a UUID"; exit 1; }
              if [ "$ACCEPT_SECRET_REVERT" != "true" ]; then echo "::error::Tick accept_secret_revert, or use redeploy-ref, which keeps current secrets."; exit 1; fi
              echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT" ;;
            d1-restore)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Run this from main."; exit 1; fi
              [[ $BOOKMARK =~ $bookmark_re ]] || { echo "::error::bookmark must be a D1 Time Travel bookmark, as printed by an earlier run"; exit 1; }
              if [ "$CONFIRM_D1_RESTORE" != "true" ]; then echo "::error::Do Export all on the host page, then tick confirm_d1_restore."; exit 1; fi
              echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown action"; exit 1 ;;
          esac
          [[ $REASON =~ $reason_re ]] || { echo "::error::reason must start with a letter or digit and may use letters, digits, spaces and . , : ( ) _ / - (100 max)"; exit 1; }

      # No credentials are left in .git/config, so npm install and test scripts cannot
      # use this job's write token. The tag is created through the API further down.
      - name: Check out the code to deploy
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pick.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit is on main
        run: |
          set -u
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main. Only code that is on main can go to production."; exit 1
          fi
          if [ "$ACTION" = "deploy" ] && git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::The tag $RELEASE_TAG already exists. Pick the next number."; exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quiz/package-lock.json

      - name: Install, typecheck, test
        working-directory: quiz
        run: |
          npm ci
          npm run typecheck
          npm test

      # The bookmark printed here is the "before" point: restore it with d1-restore to undo
      # what the migrations did. Wrangler skips its confirmation prompt in CI.
      # Pictures (Phase 3 on): the bucket is created by hand, so check it before anything changes.
      # Code without an R2 binding (an earlier release) skips this.
      - name: Check the picture bucket (R2)
        if: env.ACTION == 'deploy' || env.ACTION == 'redeploy-ref'
        working-directory: quiz
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          if ! grep -q '"r2_buckets"' wrangler.jsonc; then echo "This code binds no picture bucket; nothing to check."; exit 0; fi
          if ! npx wrangler r2 bucket info hompub-quiz-images > ../r2-out.txt 2>&1; then
            cat ../r2-out.txt
            echo "::error::The picture bucket hompub-quiz-images cannot be reached. Turn on R2 in the production Cloudflare account, create the bucket (private), and give the production token Account → Workers R2 Storage → Edit (quiz/README.md)."
            exit 1
          fi
          echo "Picture bucket hompub-quiz-images is there."

      - name: Apply quiz library migrations (D1)
        if: env.ACTION == 'deploy' || env.ACTION == 'redeploy-ref'
        working-directory: quiz
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          if [ ! -d migrations ]; then echo "This code has no D1 migrations; nothing to apply."; exit 0; fi
          BM=$(npx wrangler d1 time-travel info DB --env="" --json | jq -r '.bookmark // empty')
          if [ -z "$BM" ]; then echo "::error::Could not read the D1 bookmark. Check that the production token has Account → D1 → Edit."; exit 1; fi
          echo "D1 bookmark before migrations: $BM" | tee -a "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 migrations apply DB --remote --env="" 2>&1 | tee ../d1-out.txt

      - name: Restore the quiz library (D1)
        if: env.ACTION == 'd1-restore'
        working-directory: quiz
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          # --json skips the interactive "OK to proceed" prompt, which would answer no in CI.
          npx wrangler d1 time-travel restore DB --env="" --bookmark="$BOOKMARK" --json | tee ../restore-out.json
          PREV=$(jq -r '.previous_bookmark // empty' ../restore-out.json || true)
          if [ -z "$PREV" ]; then echo "::error::Wrangler did not confirm the restore; check the log above."; exit 1; fi
          # The undo point goes in the summary first, whatever happens next.
          echo "Restored the quiz library to $BOOKMARK. To undo, run d1-restore with bookmark $PREV." >> "$GITHUB_STEP_SUMMARY"
          # A new generation tells every host page that its cached quizzes are from before the restore
          # (PROTOCOL.md §12). An upsert, so it works even if the row is missing; tried three times.
          GEN=$(date +%s%3N)
          SQL="INSERT INTO library (id, generation) VALUES ('main', $GEN) ON CONFLICT(id) DO UPDATE SET generation = excluded.generation"
          done_gen=""
          for i in 1 2 3; do
            if npx wrangler d1 execute DB --remote --env="" --yes --command "$SQL" 2>&1 | tee ../gen-out.txt; then done_gen=1; break; fi
            if grep -q "no such table" ../gen-out.txt; then break; fi
            sleep $((i * 5))
          done
          if [ -z "$done_gen" ]; then
            if grep -q "no such table" ../gen-out.txt; then
              echo "::error::The restore went back to before the quiz library existed. Run this workflow with deploy (or redeploy-ref) to recreate its tables; host pages then ask about every quiz they still hold."
            else
              echo "::error::The restore worked, but the library generation could not be changed, so host pages would not notice the restore. From a laptop run: npx wrangler d1 execute DB --remote --command \"$SQL\""
            fi
            exit 1
          fi
          echo "Library generation set to $GEN: host pages set their cached copies aside and reload." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy or roll back
        if: env.ACTION != 'd1-restore'
        working-directory: quiz
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHECKOUT_REF: ${{ steps.pick.outputs.ref }}
        run: |
          set -u
          if [ "$ACTION" = "rollback-version" ]; then
            npx wrangler rollback "$VERSION_ID" --durable-objects-code-update-mode immediate --message="$REASON" -y 2>&1 | tee ../wrangler-out.txt
            if ! grep -q "Current Version ID: $VERSION_ID" ../wrangler-out.txt; then echo "::error::Wrangler did not confirm the rollback to $VERSION_ID; check the log above."; exit 1; fi
            echo "Rolled back to $VERSION_ID. Secrets are those of that version: re-set any secret rotated since." >> "$GITHUB_STEP_SUMMARY"
          else
            npx wrangler deploy --env="" --durable-objects-code-update-mode immediate --message="$REASON" 2>&1 | tee ../wrangler-out.txt
            VID=$(grep -Eo 'Current Version ID: [0-9a-f-]{36}' ../wrangler-out.txt | awk '{print $4}' || true)
            if [ -z "$VID" ]; then echo "::error::Wrangler printed no version id; check the log above before trusting this deploy."; exit 1; fi
            echo "Deployed $CHECKOUT_REF. Version id: $VID" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tag the deployed commit
        if: env.ACTION == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" >/dev/null
          echo "Tagged $GITHUB_SHA as $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
